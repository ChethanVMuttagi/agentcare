name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentcare
          POSTGRES_PASSWORD: agentcare
          POSTGRES_DB: agentcare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://agentcare:agentcare@localhost:5432/agentcare_ci
      AGENTCARE_TEST_POSTGRES_URL: postgresql+asyncpg://agentcare:agentcare@localhost:5432/agentcare_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
