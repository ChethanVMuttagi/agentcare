name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly disclosed CVEs in dependencies already on `main`, not
    # just ones introduced by a new push/PR.
    - cron: "0 6 * * 1"

jobs:
  backend-dependency-audit:
    name: Backend dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: pip-audit
        run: pip-audit --strict

  frontend-dependency-audit:
    name: Frontend dependency vulnerability scan (npm audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Scoped to production dependencies only (`--omit=dev`): an earlier
      # audit found every existing "high" finding in this project lives
      # entirely in dev tooling (build/lint/test chain) and is never
      # reachable from the shipped app — a naive full-tree audit would
      # falsely redden every run on transitive dev-only findings the team
      # has no realistic way to eliminate. Ship-time risk is what this
      # gate protects against.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
