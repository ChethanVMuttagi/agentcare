[project]
name = "agentcare-backend"
version = "0.1.0"
description = "AgentCare backend — agentic AI foundation for healthcare administration and care coordination."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    # IANA timezone database for `zoneinfo` (Facility.timezone validation).
    # Not optional: Windows has no system tz database at all, and some
    # minimal Linux/container images lack one too — depend on this
    # explicitly rather than assume the platform provides it.
    "tzdata>=2024.1",
    # Password hashing (Argon2id) and JWT — see app/auth/. Never implement
    # either primitive by hand.
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.9,<3.0",
    # Required for pydantic's EmailStr, used by the login request schema.
    "email-validator>=2.2,<3.0",
    # Required for FastAPI to parse multipart/form-data (file uploads) —
    # see app/api/v1/endpoints/documents.py. Pure-Python, no OS-level
    # dependency.
    "python-multipart>=0.0.12,<1.0",
    # Official Anthropic SDK — the first real LLM provider implemented in
    # STORY-010 (see app/ai/providers/anthropic_provider.py). A direct
    # provider adapter, not LangChain/LangGraph — see
    # docs/adr/ADR-0010-llm-and-tool-security-boundary.md.
    "anthropic>=0.40,<1.0",
    # Was already an install-time transitive dependency of `anthropic`
    # (which uses it as its own HTTP client) — declared directly here
    # because app/ai/providers/groq_provider.py now imports and uses it
    # itself, to call Groq's OpenAI-compatible REST API without adding a
    # second vendor SDK.
    "httpx>=0.27,<1.0",
    # Rate limiting (Sprint 2) — see app/core/rate_limit.py. In-memory
    # storage (the `limits` package's default): this process is a single
    # instance with no shared cache, the same posture the reminder engine
    # already has ("the database IS the queue" — no Redis dependency).
    "slowapi>=0.1.10,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    # Test-only SQLite driver for isolated DB tests. PostgreSQL (via asyncpg)
    # remains the production database — see docs/DATABASE.md.
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<3.0",
    # Coverage measurement + enforcement (Sprint 3) — see
    # [tool.coverage.*] below and .github/workflows/ci.yml.
    "pytest-cov>=5.0,<7.0",
    # Property-based testing (Sprint 3) — see tests/*/test_*_properties.py.
    "hypothesis>=6.100,<7.0",
    # Dependency vulnerability scanning (Sprint 3) — see
    # .github/workflows/security.yml.
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Measured baseline (Sprint 3) was 94% with the full real-PostgreSQL
# suite; 90% leaves real headroom for normal fluctuation while still
# being a genuinely enforced floor, not a rubber-stamped one. The
# lowest-covered module today (`app/workers/reminder_worker.py`, 84%)
# is a disclosed, deliberate gap — its `run_forever` poll loop isn't
# exercised by the test suite; see that module's own docstring.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
